name: Android CI - Build APK & AAB

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Offline Hindi APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Prepare Keystores for Build
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass android123 \
              -alias upload \
              -keypass android123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=LearnByImageHindi,O=AIStudio,C=IN"
          fi

      - name: Build Debug APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android123' }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Build Signed Release APK & AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android123' }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease bundleRelease --stacktrace
          else
            gradle assembleRelease bundleRelease --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LearnByImage-Hindi-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LearnByImage-Hindi-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Release App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LearnByImage-Hindi-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
